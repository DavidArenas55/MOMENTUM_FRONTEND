<mat-toolbar id="main-toolbar">
  <button mat-icon-button>
    <mat-icon>menu</mat-icon>
  </button>
  <button mat-fab color="accent" (click)="deleteSelected()">
    <mat-icon>delete</mat-icon>
  </button>
</mat-toolbar>

<div id="content-div">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" id="user-table">
    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="toggleSelectAll($event)" [checked]="isAllSelected()" [indeterminate]="isIndeterminate()"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox [disabled]="element.isDeleted" (change)="toggleSelection(element, $event)" [checked]="isSelected(element)"></mat-checkbox>
      </td>
    </ng-container>

    <!-- No. Column -->
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> {{element.id}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element"> {{element.name}} </td>
    </ng-container>

    <!-- Age Column -->
    <ng-container matColumnDef="age">
      <th mat-header-cell *matHeaderCellDef> Age </th>
      <td mat-cell *matCellDef="let element"> {{element.age}} </td>
    </ng-container>

    <!-- Mail Column -->
    <ng-container matColumnDef="mail">
      <th mat-header-cell *matHeaderCellDef> Mail </th>
      <td mat-cell *matCellDef="let element"> {{element.mail}} </td>
    </ng-container>

    <!-- isDeleted Column -->
    <ng-container matColumnDef="isDeleted">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element"> {{element.isDeleted ? 'Deleted' : 'Active'}} </td>
    </ng-container>

    <!-- Header Row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Data Row -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns; let entry;" [ngClass]="{'deleted-user': entry.isDeleted}"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[1, 5, 10, 20, 50]" [pageSize]="pageSize" [pageIndex]="page" (page)="handlePageChange($event)" [length]="length"></mat-paginator>
</div>
