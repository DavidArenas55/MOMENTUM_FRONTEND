<div class="content-div" *ngIf="!editingBusiness">
  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" id="-table">
    <!-- Delete Column -->
    <ng-container matColumnDef="delete">
      <th mat-header-cell *matHeaderCellDef>
        <mat-checkbox (change)="toggleSelectAll($event)" [checked]="isAllSelected()" [indeterminate]="isIndeterminate()"></mat-checkbox>
      </th>
      <td mat-cell *matCellDef="let element">
        <mat-checkbox [disabled]="element.isDeleted" (change)="toggleSelection(element, $event)" [checked]="isSelected(element)"></mat-checkbox>
      </td>
    </ng-container>

    <!-- No. Column -->
    <ng-container matColumnDef="_id">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element" (click)="editBusiness(element)"> {{element._id}} </td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Name </th>
      <td mat-cell *matCellDef="let element" (click)="editBusiness(element)"> {{element.name}} </td>
    </ng-container>

    <!-- Number of Locations Column -->
    <ng-container matColumnDef="locations">
      <th mat-header-cell *matHeaderCellDef> Locations </th>
      <td mat-cell *matCellDef="let element" (click)="editBusiness(element)"> {{element.location.length}} </td>
    </ng-container>

    <!-- isDeleted Column -->
    <ng-container matColumnDef="isDeleted">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        {{element.isDeleted ? 'Deleted' : 'Active'}}
        <!-- Restore button for deleted businesses -->
        <button *ngIf="element.isDeleted" mat-raised-button color="primary" (click)="restoreBusiness(element)">
          Restore
        </button>
      </td>
    </ng-container>

    <!-- Header Row -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <!-- Data Row -->
    <tr mat-row *matRowDef="let row; columns: displayedColumns; let entry;" [ngClass]="{'deleted-business': entry.isDeleted}"></tr>
  </table>

  <mat-paginator [pageSizeOptions]="[1, 5, 10, 20, 50]" [pageSize]="pageSize" [pageIndex]="page" (page)="handlePageChange($event)" [length]="length"></mat-paginator>

  <button mat-fab extended color="accent" (click)="deleteSelected()" id="delete-businesses-btn" *ngIf="selectedBusinesses.size > 0">
    <mat-icon>delete</mat-icon>
    Delete Businesses
  </button>
</div>

<div class="content-div" *ngIf="editingBusiness">
  <app-location-list [business]="editingBusiness" (closeWindow)="editingBusiness = null"></app-location-list>
</div>
