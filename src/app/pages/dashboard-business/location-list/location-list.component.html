<div class="column-wrapper">
  <div class="column">
    <button mat-button (click)="closeWindow.emit()">Go back</button>
    <h3>Locations</h3>
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" (click)="$event.stopPropagation()">

      <!-- Nombre Column -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let loc" (click)="selectLocation(loc)">
          {{ loc.nombre }}
        </td>
      </ng-container>

      <!-- Delete Button Column -->
      <ng-container matColumnDef="delete">
        <th mat-header-cell *matHeaderCellDef> Delete / Restore </th>
        <td mat-cell *matCellDef="let loc">
          <button *ngIf="!loc.isDeleted" mat-icon-button color="warn" (click)="deleteLocation(loc); $event.stopPropagation()">
            <mat-icon>delete</mat-icon>
          </button>
          <button *ngIf="loc.isDeleted" mat-icon-button color="warn" (click)="restoreLocation(loc); $event.stopPropagation()">
            <mat-icon>undo</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns; let entry" [ngClass]="{'deleted-location': entry.isDeleted}"></tr>
    </table>
  </div>

  <div class="column" *ngIf="selectedLocation">
    <p><strong>Name: </strong>{{ selectedLocation.nombre }}</p>
    <p><strong>Address: </strong>{{ selectedLocation.address }}</p>
    <p><strong>Phone: </strong>{{ selectedLocation.phone }}</p>
    <p><strong>Rating: </strong>{{ selectedLocation.rating }}</p>
    <p><strong>Service type: </strong>{{ selectedLocation.serviceType }}</p>
    <p *ngIf="selectedLocation.isDeleted" style="color: red">This location is deleted</p>
    <h3>Workers</h3>
    <app-worker-list
      [location]="selectedLocation">
    </app-worker-list>
  </div>
</div>
