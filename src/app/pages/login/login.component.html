<div class="login-container">
  <h2>Iniciar sesión</h2>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <label for="name_or_mail">Nombre o Email:</label>
    <input id="name_or_mail" formControlName="name_or_mail" type="text" required />
    <div *ngIf="loginForm.get('name_or_mail')?.invalid && loginForm.get('name_or_mail')?.touched">
      <small>El nombre o email es obligatorio.</small>
    </div>

    <label for="password">Contraseña:</label>
    <input id="password" formControlName="password" type="password" required />
    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
      <small>La contraseña es obligatoria.</small>
    </div>

    <button type="submit" [disabled]="loginForm.invalid">Iniciar sesión</button>
  </form>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</div>
